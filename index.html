<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MotoWeather</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="bg-grid"></div>

  <header>
    <div class="logo">
      <span class="logo-icon">🏍️</span>
      <span class="logo-text">MOTO<span>WEATHER</span></span>
    </div>
  </header>

  <main>
    <section class="search-section">
      <h1 class="headline">¿Es buen día<br/>para salir?</h1>
      <div class="search-bar">
        <input type="text" id="cityInput" placeholder="Ingresa tu ciudad..." />
        <button id="searchBtn">BUSCAR</button>
      </div>
      <p class="error-msg" id="errorMsg"></p>
    </section>

    <section class="result-section" id="resultSection">

      <div class="city-info">
        <h2 id="cityName">—</h2>
        <p id="dateTime">—</p>
      </div>

      <div class="semaforo-container">
        <div class="semaforo" id="semaforo">
          <div class="luz rojo" id="luzRojo"></div>
          <div class="luz amarillo" id="luzAmarillo"></div>
          <div class="luz verde" id="luzVerde"></div>
        </div>
        <div class="semaforo-label" id="semaforoLabel">—</div>
      </div>

      <div class="weather-cards">
        <div class="card">
          <span class="card-value" id="temp">—</span>
          <span class="card-label">Temperatura</span>
        </div>
        <div class="card">
          <span class="card-value" id="humidity">—</span>
          <span class="card-label">Humedad</span>
        </div>
        <div class="card">
          <span class="card-value" id="wind">—</span>
          <span class="card-label">Viento</span>
        </div>
        <div class="card">
          <span class="card-value" id="rain">—</span>
          <span class="card-label">Lluvia</span>
        </div>
      </div>

      <div class="advice-box" id="adviceBox">
        <p id="adviceText">—</p>
      </div>

    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
